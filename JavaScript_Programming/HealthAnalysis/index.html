<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Analysis Data</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <h1>Health Analysis Census</h1>
        <div class="nav-links">
            <a href="./index.html" id="home">Home</a>
            <a href="./contact.html" id="contact">Contact Us</a>
        </div>
        <div class="nav-search">
            <input type="text" id="conditionInput" placeholder="Enter a health condition">
            <button id="btnSearch">Search</button>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="container">

        <!-- Patient Form Section -->
        <div class="analysisForm">
            <h1>Healthcare Data Analysis</h1>
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name">
            </div>
            <div>
                <label>Gender:</label>
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>
            </div>
            <div>
                <label for="age">Age:</label>
                <input type="number" id="age">
            </div>
            <div>
                <label for="condition">Condition: </label>
                <select name="condition" id="condition">
                    <option value="">Select condition</option>
                    <option value="Diabetes">Diabetes</option>
                    <option value="Thyroid">Thyroid</option>
                    <option value="High Blood Pressure">High Blood Pressure</option>
                </select>
            </div>
            <button type="button" id="addPatient">Add Patient</button>
            <h2>Analysis Report</h2>
            <div id="report"></div>
        </div>

        <!-- Search Result Section -->
        <div class="searchCondition">
            <h2>Condition Details</h2>
            <div id="result"></div>
        </div>
    </div>
    <!-- JavaScript -->
    <script src="./script.js"></script>
</body>
</html>
